name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || true
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Fetch bundled tools (yt-dlp, ffmpeg)
        run: scripts/fetch-tools.sh
      - name: Build DMG (ad-hoc signed)
        run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MC-Download-Manager-dmg
          path: build/*.dmg
      # Releases are published from a local Developer ID-signed, notarized build (scripts/build.sh);
      # the CI DMG is ad-hoc signed and kept only as a workflow artifact.
